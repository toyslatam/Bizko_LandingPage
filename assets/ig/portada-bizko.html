<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#333;font-family:"Poppins","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .p{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(160deg,#2a2560 0%,#1e1b4b 60%,#17133f 100%);}
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(40% 26% at 84% 8%,rgba(139,124,246,.5),transparent 60%),radial-gradient(46% 28% at 10% 96%,rgba(249,115,98,.32),transparent 60%);}
  .grid{position:absolute;inset:0;opacity:.12;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:60px 60px;-webkit-mask-image:radial-gradient(75% 60% at 50% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(75% 60% at 50% 40%,#000 25%,transparent 78%);}
  .pad{position:relative;height:100%;padding:80px 74px;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;gap:20px;}
  .mark{width:82px;height:82px;border-radius:22px;background:linear-gradient(140deg,#9b8cf8,#6d5ee8);display:grid;place-items:center;box-shadow:0 18px 38px -14px rgba(139,124,246,.7);}
  .mark svg{width:52px;height:52px;}
  .top b{font-size:58px;font-weight:800;letter-spacing:-.01em;}
  .top .tag{margin-left:auto;font-size:26px;font-weight:600;color:#c4b5fd;}
  h1{font-size:78px;font-weight:850;line-height:1.02;letter-spacing:-.03em;margin-top:44px;}
  h1 .g{background:linear-gradient(120deg,#b7a9fb,#8b7cf6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lead{font-size:30px;color:#c9c4ee;margin-top:22px;font-weight:500;max-width:900px;}
  .mods{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;}
  .m{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:24px 22px;display:flex;align-items:center;gap:16px;}
  .m .ic{font-size:44px;line-height:1;}
  .m b{font-size:29px;font-weight:700;}
  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;}
  .foot .line{font-size:34px;font-weight:600;color:#e6e2fb;}
  .cta{background:#f97362;color:#fff;font-size:42px;font-weight:800;padding:28px 66px;border-radius:100px;box-shadow:0 20px 40px -14px rgba(249,115,98,.7);white-space:nowrap;}
  .url{font-size:40px;font-weight:800;color:#c4b5fd;letter-spacing:.01em;}
</style></head><body>
<div class="p" id="p">
  <div class="glow"></div><div class="grid"></div>
  <div class="pad">
    <div class="top">
      <span class="mark"><svg viewBox="0 0 32 32"><path d="M6.5 8 H25.5 L27 13.8 H5 Z" fill="#fff"/><rect x="7" y="14" width="18" height="12" rx="1.6" fill="#fff"/><rect x="9.4" y="16.6" width="5.2" height="9.4" rx="1" fill="#f97362"/><circle cx="19" cy="19.2" r="3" fill="none" stroke="#6d5ee8" stroke-width="1.7"/><line x1="21.2" y1="21.4" x2="23.6" y2="23.8" stroke="#6d5ee8" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <b>bizko</b>
      <span class="tag">Tu negocio, inteligente.</span>
    </div>

    <h1>Todo tu negocio.<br><span class="g">En un solo lugar.</span></h1>
    <p class="lead">La plataforma todo-en-uno para tu negocio 👇</p>

    <div class="mods">
      <div class="m"><span class="ic">🛒</span><b>Ventas</b></div>
      <div class="m"><span class="ic">📦</span><b>Inventario</b></div>
      <div class="m"><span class="ic">🏬</span><b>Catálogo</b></div>
      <div class="m"><span class="ic">🧾</span><b>Pedidos</b></div>
      <div class="m"><span class="ic">📄</span><b>Facturación</b></div>
      <div class="m"><span class="ic">🤖</span><b>IA</b></div>
      <div class="m"><span class="ic">🎯</span><b>CRM</b></div>
      <div class="m"><span class="ic">📣</span><b>Marketing</b></div>
      <div class="m"><span class="ic">⚡</span><b>Automatización</b></div>
    </div>

    <div class="foot">
      <span class="line">Empieza gratis. Crece a tu ritmo. 🚀</span>
      <span class="cta">Comenzar gratis →</span>
      <span class="url">plataformabizko.online</span>
    </div>
  </div>
</div>
</body></html>
