<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#333;font-family:"Poppins","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .story{
    width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(160deg,#2a2560 0%,#1e1b4b 58%,#17133f 100%);
  }
  .glow{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(40% 26% at 82% 10%,rgba(139,124,246,.5),transparent 60%),
      radial-gradient(44% 26% at 12% 92%,rgba(249,115,98,.32),transparent 60%);
  }
  .grid{position:absolute;inset:0;opacity:.14;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(75% 55% at 50% 42%,#000 25%,transparent 78%);
    mask-image:radial-gradient(75% 55% at 50% 42%,#000 25%,transparent 78%);
  }
  .pad{position:relative;height:100%;padding:250px 96px 240px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .badge{display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:.03em;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:16px 34px;border-radius:100px;}
  .badge .dot{width:15px;height:15px;border-radius:50%;background:#22c98a;box-shadow:0 0 16px #22c98a;}
  .brand{display:flex;align-items:center;gap:26px;margin-top:96px;}
  .mark{width:130px;height:130px;border-radius:34px;background:linear-gradient(140deg,#9b8cf8,#6d5ee8);display:grid;place-items:center;box-shadow:0 26px 54px -16px rgba(139,124,246,.75);}
  .mark svg{width:82px;height:82px;}
  .brand b{font-size:96px;font-weight:800;letter-spacing:-.02em;}
  .tag{font-size:40px;font-weight:600;color:#c4b5fd;margin-top:34px;}
  h1{font-size:104px;font-weight:800;line-height:1.03;letter-spacing:-.03em;margin-top:56px;}
  h1 .g{background:linear-gradient(120deg,#b7a9fb,#8b7cf6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .chips{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:54px;max-width:820px;}
  .chip{font-size:32px;font-weight:600;color:#e6e2fb;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:16px 34px;border-radius:100px;}
  .bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:26px;}
  .cta{display:inline-flex;align-items:center;gap:18px;background:#f97362;color:#fff;font-size:44px;font-weight:700;padding:28px 58px;border-radius:100px;box-shadow:0 22px 44px -16px rgba(249,115,98,.75);}
  .url{font-size:40px;font-weight:700;color:#c4b5fd;letter-spacing:.01em;}
  .arrow{font-size:56px;line-height:1;animation:none;}
</style>
</head>
<body>
  <div class="story" id="story">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="pad">
      <span class="badge"><span class="dot"></span> YA ESTAMOS EN LÍNEA</span>
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 32 32"><path d="M6.5 8 H25.5 L27 13.8 H5 Z" fill="#fff"/><rect x="7" y="14" width="18" height="12" rx="1.6" fill="#fff"/><rect x="9.4" y="16.6" width="5.2" height="9.4" rx="1" fill="#f97362"/><circle cx="19" cy="19.2" r="3" fill="none" stroke="#6d5ee8" stroke-width="1.7"/><line x1="21.2" y1="21.4" x2="23.6" y2="23.8" stroke="#6d5ee8" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <b>bizko</b>
      </div>
      <div class="tag">Tu negocio, inteligente.</div>
      <h1>Todo tu negocio.<br><span class="g">En un solo lugar.</span></h1>
      <div class="chips">
        <span class="chip">🛒 Ventas</span>
        <span class="chip">📦 Inventario</span>
        <span class="chip">🏬 Catálogo</span>
        <span class="chip">🤖 IA</span>
      </div>
      <div class="bottom">
        <span class="cta">Comenzar gratis</span>
        <div class="arrow">👆</div>
        <span class="url">plataformabizko.online</span>
      </div>
    </div>
  </div>
</body>
</html>
