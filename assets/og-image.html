<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family: "Poppins","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#1e1b4b; color:#fff; overflow:hidden; position:relative;
  }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(48% 60% at 82% 12%, rgba(139,124,246,.42), transparent 60%),
      radial-gradient(42% 55% at 12% 92%, rgba(249,115,98,.30), transparent 60%),
      linear-gradient(160deg,#2a2560 0%,#1e1b4b 60%,#17133f 100%);
  }
  .grid { position:absolute; inset:0; opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(70% 70% at 30% 40%,#000 20%,transparent 75%);
    mask-image:radial-gradient(70% 70% at 30% 40%,#000 20%,transparent 75%);
  }
  .wrap { position:relative; height:100%; padding:66px 70px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:16px; }
  .mark { width:64px; height:64px; border-radius:18px;
    background:linear-gradient(140deg,#9b8cf8,#6d5ee8);
    display:grid; place-items:center; box-shadow:0 14px 30px -10px rgba(139,124,246,.7); }
  .mark svg { width:40px; height:40px; }
  .brand b { font-size:40px; font-weight:800; letter-spacing:-.02em; }
  .content { margin-top:auto; }
  h1 { font-size:74px; font-weight:800; line-height:1.05; letter-spacing:-.03em; }
  h1 .g { background:linear-gradient(120deg,#b7a9fb,#8b7cf6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .chips { display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }
  .chip { font-size:22px; font-weight:600; color:#d8d3f5; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14); padding:9px 20px; border-radius:100px; }
  .foot { display:flex; align-items:center; gap:22px; margin-top:34px; }
  .cta { background:#f97362; color:#fff; font-size:26px; font-weight:700; padding:16px 34px; border-radius:100px;
    box-shadow:0 16px 30px -12px rgba(249,115,98,.7); }
  .url { font-size:26px; font-weight:600; color:#c4b5fd; }
  .badge { position:absolute; top:70px; right:70px; display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); padding:12px 22px; border-radius:100px; font-size:22px; font-weight:600; }
  .badge .dot { width:11px; height:11px; border-radius:50%; background:#22c98a; box-shadow:0 0 12px #22c98a; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="badge"><span class="dot"></span> IA + Automatización</div>
  <div class="wrap">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 32 32">
          <path d="M6.5 8 H25.5 L27 13.8 H5 Z" fill="#fff"/>
          <rect x="7" y="14" width="18" height="12" rx="1.6" fill="#fff"/>
          <rect x="9.4" y="16.6" width="5.2" height="9.4" rx="1" fill="#f97362"/>
          <circle cx="19" cy="19.2" r="3" fill="none" stroke="#6d5ee8" stroke-width="1.7"/>
          <line x1="21.2" y1="21.4" x2="23.6" y2="23.8" stroke="#6d5ee8" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </span>
      <b>bizko</b>
    </div>
    <div class="content">
      <h1>Todo tu negocio.<br><span class="g">En un solo lugar.</span></h1>
      <div class="chips">
        <span class="chip">Ventas</span>
        <span class="chip">Inventario</span>
        <span class="chip">Catálogo</span>
        <span class="chip">IA</span>
        <span class="chip">CRM</span>
        <span class="chip">Marketing</span>
      </div>
      <div class="foot">
        <span class="cta">Comenzar gratis</span>
        <span class="url">plataformabizko.online</span>
      </div>
    </div>
  </div>
</body>
</html>
